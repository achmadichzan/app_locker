[workspace]
members = [
    "crates/core",
    "crates/infra",
    "crates/ui"
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Achmad Ichzan"]

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
windows-service = "0.8"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"