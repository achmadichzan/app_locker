[workspace]
members = [
    "crates/core",
    "crates/infra",
    "crates/ui"
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Achmad Ichzan"]

[workspace.dependencies]
sysinfo = "0.30"
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"

[profile.release]
strip = true
lto = true
opt-level = "s"
codegen-units = 1