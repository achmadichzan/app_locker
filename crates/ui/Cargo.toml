[package]
name = "ui"
version.workspace = true
edition.workspace = true

[dependencies]
app_core = { path = "../core" }
slint = { version = "1.15.1", default-features = false, features = ["backend-winit", "renderer-software", "compat-1-2"] }
serde_json = "1.0"

[build-dependencies]
slint-build = "1.15.1"

[dependencies.windows]
version = "0.52"
features = [
    "Win32_UI_WindowsAndMessaging",
]
